# Docker Compose for Raspberry Pi (ARM64)
# Copy this file to your Raspberry Pi and run: docker-compose up -d

services:
  drivewise:
    image: drivewise:latest-arm64  # Use the ARM64 image
    ports:
      - "8800:8800"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8800
    restart: unless-stopped
    container_name: drivewise-rpi
    # Ensure network access for external API calls
    network_mode: "host"
    # Add explicit DNS servers for reliable external connectivity
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    # Optional: Add resource limits for Raspberry Pi
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M